<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konfetti Deco</title><link rel="icon" type="image/png" href="icons/favicon-64.png"><meta name="theme-color" content="#2A2C2F">
<style>body{margin:0;background:#1E1F21;color:#E3E3E0;font:16px/1.4 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}a{color:#5DB896}</style>
<script>
/* Konfetti Deco moved to app/. The first offline cache of this address is removed, then the app opens. */
(function(){var go=function(){location.replace('app/'+location.search+location.hash)};
  try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.filter(function(r){return !/\/app\/$/.test(r.scope)}).map(function(r){return r.unregister()}))}).then(go,go);
    if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){if(/^loulou-/.test(k))caches.delete(k)})});setTimeout(go,1500);return}}catch(e){}
  go()})();
</script></head>
<body><p>Открываю Konfetti Deco… Если не открылось — <a href="app/">нажмите здесь</a>.</p></body></html>
